<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Station Control KP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: control-room list view. Sticky tab rail, one summary strip, dense ruled rows grouped by the six duties. */
:root{
  --bg:#EBEFF2;--surface:#FFFFFF;--surface2:#F3F6F8;--ink:#12202B;--muted:#586774;--line:#D5DDE3;
  --accent:#0B6E8A;--accent-ink:#FFFFFF;--accent-soft:#D9EEF4;
  --good:#1B7A4B;--good-soft:#DCF1E5;--warn:#8F5600;--warn-soft:#FBE9C6;--bad:#B3261E;--bad-soft:#F8DDDA;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E161D;--surface:#16212A;--surface2:#1C2A35;--ink:#E6EDF2;--muted:#93A4B1;--line:#2B3A46;
    --accent:#5CC0DA;--accent-ink:#06222B;--accent-soft:#143441;
    --good:#5FD39A;--good-soft:#143A29;--warn:#F0B454;--warn-soft:#3F2E0E;--bad:#FF8F86;--bad-soft:#47201D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161D;--surface:#16212A;--surface2:#1C2A35;--ink:#E6EDF2;--muted:#93A4B1;--line:#2B3A46;
  --accent:#5CC0DA;--accent-ink:#06222B;--accent-soft:#143441;
  --good:#5FD39A;--good-soft:#143A29;--warn:#F0B454;--warn-soft:#3F2E0E;--bad:#FF8F86;--bad-soft:#47201D;
  color-scheme:dark;
}
*{box-sizing:border-box}
h1,h2,h3,p,ol,ul{margin:0}
body{
  background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 56px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
small{color:var(--muted);font-size:.78rem;line-height:1.4}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:8px 0 6px}
.hd>div{min-width:0}
.eyebrow{font-size:.7rem;letter-spacing:.14em;color:var(--accent);font-weight:500}
h1{font-size:1.55rem;line-height:1.25;font-weight:600;text-wrap:balance}
.role{color:var(--muted);font-size:.85rem}
.clk{text-align:right;flex:none}
.clk b{display:block;font-size:1.7rem;line-height:1.1;font-weight:500}
.clk span{font-size:.72rem;color:var(--muted)}
.sim{font-size:.78rem;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px;margin:4px 0 12px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stats>div{padding:10px 12px;border-left:1px solid var(--line);min-width:0}
.stats>div:first-child{border-left:0}
.stats .k{display:block;font-size:.72rem;color:var(--muted)}
.stats b{display:block;font-size:1.45rem;line-height:1.25;font-weight:600}
.stats small{display:block;font-size:.68rem}
.stats .good b{color:var(--good)}.stats .warn b{color:var(--warn)}.stats .bad b{color:var(--bad)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap;font-weight:500;font-size:.88rem}
.tab .n{font-size:.72rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] .n{color:var(--accent-ink);opacity:.8}
.bd{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font:600 .72rem/20px var(--f-mono);text-align:center}
.tab[aria-selected="true"] .bd{background:var(--accent-ink);color:var(--accent)}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 2px 8px}
.sec-h:first-child{margin-top:8px}
h2{font-size:1rem;font-weight:600}
.sec-h .sub{font-size:.75rem;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>.grow{flex:1;min-width:0}
.row b{font-weight:600}
.row .t{display:block}
.cols{display:grid;gap:0 18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}
.cols>*{min-width:0}
.foot{font-size:.78rem;color:var(--muted);margin:8px 2px 0}
.hint{font-size:.78rem;color:var(--muted);margin-top:8px}
.pad{padding:14px}

.chip{display:inline-flex;align-items:center;white-space:nowrap;padding:1px 9px;border-radius:99px;font-size:.74rem;font-weight:500;background:var(--surface2);color:var(--muted);line-height:1.6}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.mut{background:transparent;border:1px solid var(--line)}
.chip.mono{font-family:var(--f-mono)}

.btn{min-height:40px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:500;font-size:.85rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dng{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{min-height:34px;padding:4px 11px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.fl{border-top:1px solid var(--line)}
.fl:first-child{border-top:0}
.fl.past .fl-h{opacity:.62}
.fl-h{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 14px;cursor:pointer}
.fl.open .fl-h{background:var(--surface2)}
.tm b{display:block;font:500 1.05rem/1.2 var(--f-mono)}
.tm i{display:block;font:500 .74rem/1.3 var(--f-mono);font-style:normal;color:var(--warn)}
.fi b{font-family:var(--f-mono);font-weight:600;margin-right:6px}
.fi small{display:block}
.st{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pn{padding:4px 14px 16px;background:var(--surface2);border-top:1px solid var(--line)}
.pn-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 8px;font-size:.82rem;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.tasks{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.task{display:flex;gap:10px;align-items:center;min-height:46px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;cursor:pointer;font-size:.88rem}
.task:disabled{cursor:default}
.task .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;font-size:.8rem;font-weight:700;line-height:1}
.task.on .bx{background:var(--good);border-color:var(--good);color:var(--surface)}
.task.on span:last-child{color:var(--muted)}

.frm{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;margin-top:14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:.76rem;color:var(--muted)}
.fld.wide{grid-column:1/-1}
input[type=number],input[type=text],select,textarea{width:100%;min-height:40px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{min-height:76px;resize:vertical}

.log{list-style:none;padding:0}
.log li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:.88rem}
.log li:first-child{border-top:0}
.log .tt{font:500 .8rem/1.7 var(--f-mono);color:var(--muted)}
.log .ag{font-weight:600}

.meter{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:10px}
.meter.good i{background:var(--good)}.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}
.big{font:500 1.9rem/1.1 var(--f-mono)}
.big small{font-size:.9rem;font-family:var(--f-body)}
.split{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px}
.pair{display:flex;gap:8px;flex-wrap:wrap}

.track{position:relative;height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;border-radius:10px;background:var(--accent)}
.track i.warn{background:var(--warn)}.track i.bad{background:var(--bad)}
.track u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}
.bl{display:flex;justify-content:space-between;gap:10px;font-size:.86rem}
.bl span:last-child{font:500 .78rem var(--f-mono);color:var(--muted);white-space:nowrap}
.bud{padding:11px 14px;border-top:1px solid var(--line)}
.bud:first-child{border-top:0}

.chart{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tg{stroke:var(--accent);stroke-width:1;stroke-dasharray:4 4}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);fill-opacity:.12;stroke:none}
.chart .dt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart text{fill:var(--muted);font:10px var(--f-mono)}
.chart text.em{fill:var(--ink);font-weight:600;font-size:11px}

.rep{white-space:pre-wrap;overflow-wrap:anywhere;font:.8rem/1.75 var(--f-mono);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th,.tbl td{text-align:left;padding:10px 14px;border-top:1px solid var(--line)}
.tbl tr:first-child th,.tbl tr:first-child td{border-top:0}
.tbl td:last-child{text-align:right;font-family:var(--f-mono)}
.scroll{overflow-x:auto}

.air{position:relative;height:min(58vh,520px);min-height:320px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface2)}
.air canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.air .msg{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted);font-size:.9rem}
.hud{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.srcs{margin:0;padding:12px 14px 12px 32px;font-size:.82rem;line-height:1.9}
.srcs a{color:var(--accent)}
.facts{display:grid;gap:8px 14px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:10px}
.facts div{min-width:0}
.facts small{display:block}
.facts b{font-weight:500;font-size:.9rem}
.note{font-size:.82rem;color:var(--muted);margin-top:10px;line-height:1.6}
.note b{color:var(--ink);font-weight:600}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.hd .brand{display:flex;gap:12px;align-items:center;min-width:0}
.chart .bg{fill:var(--good)}.chart .bw{fill:var(--warn)}.chart .bn{fill:var(--accent)}
.chart text.vl{fill:var(--ink);font-size:8.5px}
.feed{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:7px;font-size:.84rem}
.feed li{display:flex;gap:8px;align-items:center;min-width:0}
.feed .tt{color:var(--muted);font-size:.76rem}
#toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:30}
#toast span{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.85rem;max-width:100%}
#toast:empty{display:none}

@media (max-width:420px){
  h1{font-size:1.35rem}
  .fl-h{grid-template-columns:56px minmax(0,1fr) auto;padding:12px 12px}
  .stats>div{padding:9px 8px}
  .stats b{font-size:1.25rem}
}
@media (prefers-reduced-motion:no-preference){
  .bar i,.meter i,.track i{transition:width .3s ease}
}
</style>

</head>

    {id:2,type:'UMNR',d:'Unaccompanied minor, age 9 · 1 pax',f:'PG 211',staff:'Prang',st:0},

    {id:5,type:'MEDA',d:'Needs medical assistance, medical certificate checked',f:'PG 935',staff:'Wichai',st:0}
  ],
  lounge:{n:74,cap:120},
  lng:{auto:true,log:[],pin:0,t:2},
  conn:[
    {a:'Inbound PG 262 Phuket',b:'Outbound PG 935 Singapore',n:4,left:55},
    {a:'Inbound PG 124 Chiang Mai',b:'Outbound PG 275 Samui',n:3,left:22},

  ],

/* ---------- helpers ---------- */
const fl=id=>S.flights.find(f=>f.id===id);
const val=(id,def)=>S.form[id]!==undefined?S.form[id]:def;
const doneCount=f=>TASKS.filter(t=>f.tasks[t.k]).length;
const addLog=x=>{S.log.unshift({t:nowHM(),x});S.log=S.log.slice(0,30)};
const chip=(k,t,extra)=>`<span class="chip ${k||''} ${extra||''}">${t}</span>`;
const opts=(list,cur)=>list.map(o=>{const v=Array.isArray(o)?o[0]:o;const l=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}" ${String(cur)===String(v)?'selected':''}>${esc(l)}</option>`}).join('');
const sortStd=(a,b)=>a.std.localeCompare(b.std);

function phase(f){
  if(f.cancelled) return {k:'bad',t:'Cancelled'};
  if(f.departed) return {k:'mut',t:'Departed'};
  const n=doneCount(f);
  if(n===6) return {k:'good',t:'Ready to depart'};
  if(f.tasks.brd) return {k:'acc',t:'Boarding'};
  if(n>=1) return {k:'acc',t:'Preparing aircraft'};
  if(f.ci) return {k:'',t:'Check-in open'};
  return {k:'mut',t:'Check-in not yet open'};
}
function otp(){
  const dep=S.flights.filter(f=>f.departed);
  const on=dep.filter(f=>f.delay<=15).length;
  return (BASE.on+on)/(BASE.dep+dep.length)*100;
}
const openItems=()=>S.cases.filter(c=>c.st<2).length+S.inc.filter(i=>i.st<2).length;
function badge(k){
  if(k==='ops') return S.flights.filter(f=>!f.departed&&!f.cancelled&&f.delay>0).length;
  if(k==='pax') return S.cases.filter(c=>c.st<2).length+S.specials.filter(s=>s.st===0).length;
  if(k==='safety') return S.inc.filter(i=>i.st<2).length+S.dg.filter(x=>!x.on).length;
  if(k==='coord') return S.agencies.filter(a=>a.st!=='good').length;
  if(k==='team') return S.roster.filter(r=>r.have<r.need).length;
  if(k==='report') return S.imp.filter(i=>!i.sent).length;
  return 0;
}
function curShiftIdx(){
  const h=parseInt(nowHM().slice(0,2),10);
  return S.roster.findIndex(r=>r.from<r.to?(h>=r.from&&h<r.to):(h>=r.from||h<r.to));
}
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.innerHTML='<span>'+esc(msg)+'</span>';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.innerHTML=''},2400);
}

/* ---------- chrome ---------- */
function renderStats(){
  const o=otp();
  const dep=BASE.dep+S.flights.filter(f=>f.departed).length;
  const tot=BASE.dep+S.flights.length;
  const late=S.flights.filter(f=>!f.cancelled&&f.delay>15).length;
  const open=openItems();
  const ok=o>=90?'good':(o>=85?'warn':'bad');
  document.getElementById('stats').innerHTML=
    `<div class="${ok}"><span class="k">OTP today</span><b class="mono">${o.toFixed(1)}%</b><small>Target ≥ 90%</small></div>`+
    `<div><span class="k">Departed</span><b class="mono">${dep}/${tot}</b><small>flights</small></div>`+
    `<div class="${late?'warn':'good'}"><span class="k">Late &gt; 15 min</span><b class="mono">${late}</b><small>flights</small></div>`+
    `<div class="${open?'warn':'good'}"><span class="k">Open items</span><b class="mono">${open}</b><small>cases/incidents</small></div>`;
}
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(t=>{

    return `<button class="tab" role="tab" aria-selected="${S.tab===t.k}" data-a="tab" data-v="${t.k}"><span class="n mono">${t.n}</span>${t.t}${b>0?`<span class="bd">${b}</span>`:''}</button>`;

/* ---------- 1 Flights ---------- */
function flightRow(f){
  const p=phase(f), open=S.sel===f.id;
  const past=f.departed||f.cancelled;
  return `<article class="fl ${open?'open':''} ${past?'past':''}">
    <button class="fl-h" data-a="sel" data-id="${esc(f.id)}" aria-expanded="${open}">
      <span class="tm"><b>${f.std}</b>${f.delay>0&&!f.cancelled?`<i>→ ${addMin(f.std,f.delay)}</i>`:''}</span>
      <span class="fi"><b>${f.id}</b>${esc(f.dest)}<small>Gate ${f.gate} · ${f.ac} · Pax ${f.pax}/${f.cap}</small></span>
      <span class="st">${chip(p.k,p.t)}${f.delay>0&&!f.cancelled?chip('warn','+'+f.delay+' min','mono'):''}</span>
    </button>
    ${open?panel(f):''}
  </article>`;
}
function panel(f){
  const n=doneCount(f), pct=Math.round(n/6*100), live=!f.departed&&!f.cancelled;
  const tasks=TASKS.map(t=>{
    const on=!!f.tasks[t.k];
    return `<button class="task ${on?'on':''}" role="checkbox" aria-checked="${on}" data-a="task" data-id="${esc(f.id)}" data-k="${t.k}" ${live?'':'disabled'}><span class="bx">${on?'✓':''}</span><span>${t.t}</span></button>`;
  }).join('');
  let ctl='';
  if(live){
    const confirming=S.confirm===f.id;
    ctl=`<div class="frm">
        <div class="fld"><label for="dmin">Delay (minutes)</label><input id="dmin" type="number" min="0" step="5" inputmode="numeric" value="${esc(val('dmin',f.delay||0))}"></div>
        <div class="fld"><label for="dcode">Reason (IATA delay code)</label><select id="dcode">${opts(Object.entries(REASONS),val('dcode',f.reason||'93'))}</select></div>
        <button class="btn" data-a="delay" data-id="${esc(f.id)}">Save delay</button>
      </div>
      <div class="btns">
        <button class="btn pri" data-a="release" data-id="${esc(f.id)}" ${n<6?'disabled':''}>Release flight</button>
        ${confirming
          ?`<button class="btn dng" data-a="cancel-yes" data-id="${esc(f.id)}">Confirm cancel ${f.id}</button><button class="btn" data-a="cancel-no">Keep flight</button>`
          :`<button class="btn" data-a="cancel" data-id="${esc(f.id)}">Cancel flight</button>`}
      </div>
      ${n<6?'<p class="hint">The flight can be released once all 6 steps are done</p>':''}`;
  }
  const rs=f.delay>0&&f.reason?`<p class="hint">Delay code ${esc(REASONS[f.reason]||f.reason)}</p>`:'';
  return `<div class="pn">
    <div class="pn-top"><span>Turnaround steps ${n}/6</span><div class="bar"><i style="width:${pct}%"></i></div><span class="mono">${pct}%</span></div>
    <div class="tasks">${tasks}</div>
    ${rs}${ctl}
  </div>`;
}
function vOps(){
  const act=S.flights.filter(f=>!f.departed&&!f.cancelled).sort(sortStd);
  const past=S.flights.filter(f=>f.departed||f.cancelled).sort(sortStd);
  return `<div class="sec-h"><h2>Flights in progress</h2><span class="sub mono">${act.length} flights</span></div>
    <div class="list">${act.length?act.map(flightRow).join(''):'<div class="row"><span class="grow">No pending flights at the moment</span></div>'}</div>
    <div class="sec-h"><h2>Departed / cancelled</h2><span class="sub mono">${past.length} flights</span></div>
    <div class="list">${past.map(flightRow).join('')}</div>
    <p class="foot">Another ${BASE.dep} flights departed earlier today, ${BASE.on} of them on time, already counted in OTP.</p>
    <div class="sec-h"><h2>Control centre event log</h2><span class="sub">Latest first</span></div>
    <ol class="log list">${S.log.map(l=>`<li><span class="tt">${l.t}</span><span>${esc(l.x)}</span></li>`).join('')}</ol>`;
}

/* ---------- 2 Passengers ---------- */
function careRows(){
  const rows=S.flights.filter(f=>!f.departed&&(f.cancelled||f.delay>=30)).sort(sortStd);
  if(!rows.length) return '<div class="row"><span class="grow">No flights need special care right now</span></div>';
  return rows.map(f=>{
    let lv,k;
    if(f.cancelled){lv='Rebook or refund, and consider accommodation';k='bad'}
    else if(f.delay>=180){lv='Meal vouchers, and consider accommodation';k='bad'}
    else if(f.delay>=60){lv='Meal and drink vouchers';k='warn'}
    else{lv='Water and snacks';k='warn'}
    return `<div class="row"><div class="grow"><span class="t"><b class="mono">${f.id}</b> ${f.cancelled?'Cancelled':'Delayed '+f.delay+' min'}</span><small>${lv}</small></div>${chip(k,f.pax+' passengers')}</div>`;
  }).join('');
}

  const L=S.lounge, g=S.lng, lp=Math.round(L.n/L.cap*100);

  return `<div class="split"><div class="big">${L.n}<small> / ${L.cap} seats</small></div>${chip(lk,lp+'%','mono')}</div>

function otpChart(){
  const live=otp();

  const W=340,H=180,Lm=36,Rm=16,Tm=22,Bm=28,min=84,max=100;
  const x=i=>Lm+i*(W-Lm-Rm)/(pts.length-1);
  const y=v=>Tm+(max-Math.max(min,Math.min(max,v)))*(H-Tm-Bm)/(max-min);
  const labels=pts.map((_,i)=>{
    const d=new Date(Date.now()-(pts.length-1-i)*86400000);
    const p=wfmt.formatToParts(d);
    const wd=(p.find(q=>q.type==='weekday')||{value:''}).value;
    const dy=(p.find(q=>q.type==='day')||{value:''}).value;

  const line=pts.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const area=line+` L${x(pts.length-1).toFixed(1)} ${y(min)} L${x(0).toFixed(1)} ${y(min)} Z`;
  const xl=labels.map((l,i)=>`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`).join('');
  const last=pts.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="OTP trend for the last 7 days, today ${live.toFixed(1)} percent">
    ${grid}<text x="${W-Rm}" y="${y(90)-5}" text-anchor="end">Target 90%</text>

  moveGuests(dt){

function gateRows(){
  const rows=GATES.map(g=>{
    const p=AIR.ready?AIR.slots[g.n]:null;
    const st=p?chip(p.phase==='park'?(p.real?'good':'acc'):'acc',PH_TH[p.phase]):chip('mut','Vacant');
    return `<div class="row"><b class="mono">${g.n}</b><div class="grow">${p?`<b class="mono">${esc(p.id)}</b>${p.real?' <small>Flight from the Flights tab</small>':' <small>Demo traffic</small>'}`:'<small>No aircraft</small>'}</div>${st}</div>`;
  });
  const rw=AIR.ready?AIR.planes.filter(p=>['land','roll','hold','lineup','toroll','climb'].indexOf(p.phase)>=0||p.phase==='dtaxi'):[];
  const rwRow=`<div class="row"><b class="mono">RWY</b><div class="grow">${rw.length?rw.map(p=>`<b class="mono">${esc(p.id)}</b> <small>${PH_TH[p.phase]}</small>`).join('<br>'):'<small>Runway clear</small>'}</div>${chip(rw.length?'warn':'good',rw.length?'In use':'Clear')}</div>`;
  const L=S.lounge,lp=Math.round(L.n/L.cap*100);
  const lngRow=`<div class="row"><b class="mono">LNG</b><div class="grow"><b class="mono">${L.n}/${L.cap}</b> <small>guests in the lounge${AIR.ready&&AIR.guests.length?' · '+AIR.guests.length+' walking':''}</small></div>${chip(lp>=90?'bad':(lp>=75?'warn':'good'),lp+'%','mono')}</div>`;
  return rows.join('')+rwRow+lngRow;
}

/* ---------- actions ---------- */
function act(a,d){
  switch(a){
    case 'tab':
      S.tab=d.v;S.confirm=null;render();window.scrollTo(0,0);return;
    case 'sel':
      S.sel=S.sel===d.id?null:d.id;S.confirm=null;delete S.form.dmin;delete S.form.dcode;break;
    case 'task':{
      const f=fl(d.id);if(!f||f.departed||f.cancelled)return;
      const t=TASKS.find(x=>x.k===d.k);
      f.tasks[d.k]=!f.tasks[d.k];
      if(f.tasks[d.k]) addLog(f.id+' '+t.t+' completed');
      break;}
    case 'delay':{
      const f=fl(d.id);if(!f)return;
      const m=Math.max(0,parseInt(val('dmin',f.delay||0),10)||0);
      const code=val('dcode',f.reason||'93');
      f.delay=m;f.reason=m>0?code:'';
      addLog(m>0?f.id+' delayed '+m+' min · '+REASONS[code]:f.id+' back on schedule');
      delete S.form.dmin;delete S.form.dcode;
      toast(m>0?'Saved: '+f.id+' delayed '+m+' min':f.id+' on schedule');
      break;}
    case 'release':{
      const f=fl(d.id);if(!f||doneCount(f)<6)return;
      f.departed=true;S.sel=null;S.confirm=null;
      if(AIR.ready)AIR.depart(f.gate);
      addLog(f.id+' departed '+(f.delay>15?f.delay+' min late':'on time'));
      toast(f.id+' departed');
      break;}
    case 'cancel':S.confirm=d.id;break;
    case 'cancel-no':S.confirm=null;break;
    case 'cancel-yes':{
      const f=fl(d.id);if(!f)return;
      f.cancelled=true;S.sel=null;S.confirm=null;
      addLog(f.id+' cancelled. Rebooking and care started for '+f.pax+' passengers');
      toast(f.id+' cancelled');
      break;}
    case 'sp':{const s=S.specials.find(x=>String(x.id)===d.id);if(s&&s.st<2){s.st++;addLog(s.f+' passenger '+s.type+' · '+STS[s.st])}break;}
    case 'case':{const c=S.cases.find(x=>x.id===d.id);if(c&&c.st<2){c.st++;addLog(c.id+' · '+CST[c.st])}break;}
    case 'lounge':{
      const n=parseInt(d.n,10);const L=S.lounge;
      L.n=Math.max(0,Math.min(L.cap,L.n+n));if(AIR.ready)AIR.updateLoungeLabel();break;}
    case 'lng-auto':{S.lng.auto=!S.lng.auto;break;}
    case 'dg':{const x=S.dg[parseInt(d.i,10)];if(x)x.on=!x.on;break;}
    case 'inc':{const i=S.inc.find(x=>x.id===d.id);if(i&&i.st<2){i.st++;addLog(i.id+' · '+IST[i.st])}break;}
    case 'inc-add':{
      const txt=String(val('inc-d','')).trim();
      if(!txt){toast('Enter the incident details before saving');return;}
      const id='SR-2610-0'+String(S.incNext++).padStart(2,'0');
      S.inc.unshift({id,c:val('inc-c','Ramp safety'),sev:val('inc-s','Low'),d:txt,st:0});
      addLog('Incident '+id+' logged · '+val('inc-c','Ramp safety'));
      delete S.form['inc-d'];
      toast('Incident '+id+' saved');
      break;}
    case 'co-add':{
      const m=String(val('co-m','')).trim();
      if(!m){toast('Type the coordination message before adding it');return;}
      S.coord.unshift({t:nowHM(),a:val('co-a',S.agencies[0].n),m});
      delete S.form['co-m'];
      toast('Coordination entry added');
      break;}
    case 'staff':{
      const r=S.roster[parseInt(d.i,10)];
      if(r&&r.have<r.need){
        r.have++;S.budget[0].a+=3;
        addLog('Overtime staff called in for '+r.n+' ('+r.have+'/'+r.need+')');
        toast('Overtime staff called in for '+r.n);
      }
      break;}
    case 'imp':{const x=S.imp[parseInt(d.i,10)];if(x){x.sent=true;toast('Proposal sent to head office')}break;}
    case 'air-arr':{if(AIR.ready){AIR.arrT=0;if(!AIR.freeGate())toast('All gates are full. Release a departure first')}break;}
    case 'air-dep':{if(AIR.ready){if(AIR.departAny())toast('Aircraft released from the gate');else toast('No aircraft are parked at a gate yet')}break;}
    case 'air-cam':{if(AIR.ready)AIR.preset(d.v);break;}
    case 'air-pause':{AIR.paused=!AIR.paused;break;}
    case 'air-speed':{AIR.speed=AIR.speed>=3?1:AIR.speed+1;break;}
    case 'copy':{copyReport();return;}
    default:return;
  }
  render();
}
async function copyReport(){
  const text=buildReport();
  try{
    await navigator.clipboard.writeText(text);
    toast('Report copied');
  }catch(e){
    const el=document.getElementById('rep');
    if(el){const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r)}
    toast('Report text selected. You can copy it now');
  }
}

document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-a]');
  if(!b||b.disabled)return;
  act(b.dataset.a,b.dataset);
});
const saveField=e=>{const t=e.target;if(t&&t.id&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'))S.form[t.id]=t.value};
document.addEventListener('input',saveField);
document.addEventListener('change',saveField);

function tick(){
  const c=document.getElementById('clock'),d=document.getElementById('dt');
  if(c)c.textContent=nowHM();
  if(d)d.textContent=dfmt.format(new Date());
}
function lngRefresh(){
  const c=document.getElementById('lng-card');if(c)c.innerHTML=loungeCard();
  if(AIR.ready)AIR.updateLoungeLabel();
}
function lngApply(kind){
  const L=S.lounge;
  if(kind==='in')L.n=Math.min(L.cap,L.n+1);else L.n=Math.max(0,L.n-1);
  S.lng.log.unshift({t:nowHM(),k:kind,n:L.n});
  S.lng.log=S.lng.log.slice(0,6);
  lngRefresh();
}
function lngTick(){
  const g=S.lng,L=S.lounge;
  if(!g.auto)return;
  const walking=AIR.ready&&AIR.active;
  if(walking&&AIR.paused)return;
  g.t-=0.5;if(g.t>0)return;
  g.t=walking?0.5+Math.random():1+Math.floor(Math.random()*4);
  if(walking&&AIR.guests.length>=14)return;
  const proj=L.n+g.pin;
  const target=82+14*Math.sin(Date.now()/90000);
  const pIn=Math.max(0.15,Math.min(0.85,0.5+(target-proj)/60));
  const kind=Math.random()<pIn?'in':'out';
  if(kind==='in'&&proj>=L.cap)return;
  if(kind==='out'&&L.n<=0)return;
  if(walking)AIR.spawnGuest(kind);else lngApply(kind);
}
(function boot(){
  const h=String(location.hash||'').slice(1);
  if(TABS.some(t=>t.k===h))S.tab=h;
  tick();render();
  setInterval(tick,15000);
  setInterval(lngTick,500);
  setInterval(()=>{
    if(S.tab!=='air'||!AIR.ready)return;
    const el=document.getElementById('gatelist');if(el)el.innerHTML=gateRows();
    const ac=document.getElementById('aircount');if(ac)ac.textContent=AIR.planes.length+' aircraft in the area';
  },1000);
  window.addEventListener('resize',()=>{
    const host=document.getElementById('air3d');
    if(S.tab==='air'&&AIR.ready&&host)AIR.resize(host);
  });
})();
</script>
